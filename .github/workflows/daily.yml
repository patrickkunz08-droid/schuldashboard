name: Erinnerungen planen

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python notify.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
